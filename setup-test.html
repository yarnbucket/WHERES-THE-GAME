<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WTG Resolve Diagnostic</title>
<style>
:root{--bg:#07111f;--card:#101d2f;--line:#263a54;--ink:#f4f8ff;--muted:#9db0c8;--blue:#4aa3ff;--green:#43d17a;--red:#ff6b78;--gold:#f6c453}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#0b1625);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:920px;margin:auto;padding:18px 12px 60px}h1{margin:0;font-size:28px}p{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.controls select,.controls input,.controls button{height:44px;border-radius:10px;border:1px solid var(--line);font:inherit}.controls select,.controls input{background:#0b1727;color:var(--ink);padding:0 10px}.controls button{background:var(--blue);color:#06111f;font-weight:900;padding:0 16px;cursor:pointer}.status{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}.ok{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.metric{background:#0b1727;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}.metric b{font-size:24px;display:block}.metric span{font-size:10px;color:var(--muted);font-weight:900}.games{display:grid;gap:7px}.game{background:#0b1727;border:1px solid var(--line);border-radius:10px;padding:10px}.game strong{display:block}.meta{color:var(--muted);font-size:12px;margin-top:4px}.rank{color:var(--gold);font-weight:900}.raw{white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;background:#06101c;border-radius:10px;padding:10px;color:#b8cae0;font:12px ui-monospace,Consolas,monospace}.small{font-size:12px;color:var(--muted)}
@media(max-width:700px){.controls{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
<h1>WTG RESOLVE DIAGNOSTIC</h1>
<p>Tests the same live Render <code>/resolve</code> endpoint used by Where's the Game. No app data is changed.</p>
<section class="card">
  <div class="controls">
    <select id="sport"><option value="ncaaf">NCAAF</option><option value="nfl">NFL</option><option value="mlb">MLB</option><option value="nhl">NHL</option><option value="nba">NBA</option><option value="ncaab">NCAAB</option></select>
    <input id="date" type="date" value="2026-09-12">
    <button id="run">RUN TEST</button>
  </div>
  <div class="status" id="status"><span class="pill warn">READY</span></div>
  <div class="small" id="url" style="margin-top:10px"></div>
</section>
<section class="card">
  <div class="grid">
    <div class="metric"><b id="total">—</b><span>TOTAL</span></div>
    <div class="metric"><b id="top25">—</b><span>TOP 25 GAMES</span></div>
    <div class="metric"><b id="fbs">—</b><span>FBS</span></div>
    <div class="metric"><b id="fcs">—</b><span>FCS</span></div>
    <div class="metric"><b id="dii">—</b><span>DII</span></div>
    <div class="metric"><b id="diii">—</b><span>DIII</span></div>
  </div>
</section>
<section class="card"><h2>Returned games</h2><div class="games" id="games"><div class="small">Run a test to view results.</div></div></section>
<section class="card"><h2>Ranking health</h2><div id="ranking" class="small">Run NCAAF to inspect ranking metadata.</div></section>
<section class="card"><details><summary><b>Raw /resolve JSON</b></summary><pre class="raw" id="raw"></pre></details></section>
</div>
<script>
const API_BASE='https://wheres-the-game.onrender.com';
const $=id=>document.getElementById(id);
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalizeDivision(v){const s=String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(s==='FBS'||s==='1A'||s==='DIA')return'FBS';if(s==='FCS'||s==='1AA'||s==='DIAA')return'FCS';if(s==='DII'||s==='D2'||s==='DIVISIONII')return'DII';if(s==='DIII'||s==='D3'||s==='DIVISIONIII')return'DIII';return String(v||'UNKNOWN').toUpperCase()}
function rank(v){const n=Number(v);return Number.isFinite(n)&&n>=1&&n<=25?n:null}
function gamesFrom(data){if(Array.isArray(data))return data;if(Array.isArray(data?.games))return data.games;if(Array.isArray(data?.events))return data.events;if(Array.isArray(data?.results))return data.results;return[]}
function setStatus(text,cls){$('status').innerHTML=`<span class="pill ${cls}">${esc(text)}</span>`}
async function run(){
 const sport=$('sport').value;const date=$('date').value.replaceAll('-','');
 const url=`${API_BASE}/resolve?sport=${encodeURIComponent(sport)}&date=${encodeURIComponent(date)}&provider=directv`;
 $('url').textContent=url;setStatus('REQUESTING LIVE /resolve…','warn');$('games').innerHTML='<div class="small">Loading…</div>';
 try{
   const started=performance.now();const res=await fetch(url,{cache:'no-store'});const ms=Math.round(performance.now()-started);const text=await res.text();let data;
   try{data=JSON.parse(text)}catch{throw new Error(`HTTP ${res.status}: response was not valid JSON`)}
   $('raw').textContent=JSON.stringify(data,null,2);
   if(!res.ok)throw new Error(`HTTP ${res.status} ${res.statusText}`);
   const games=gamesFrom(data);setStatus(`HTTP ${res.status} OK • ${ms} ms`,'ok');
   const counts={FBS:0,FCS:0,DII:0,DIII:0};let top25=0;
   for(const g of games){const d=normalizeDivision(g.division||g.subdivision||g.ncaaDivision);if(counts[d]!=null)counts[d]++;if(rank(g.awayRank)||rank(g.homeRank))top25++}
   $('total').textContent=games.length;$('top25').textContent=top25;$('fbs').textContent=counts.FBS;$('fcs').textContent=counts.FCS;$('dii').textContent=counts.DII;$('diii').textContent=counts.DIII;
   $('games').innerHTML=games.length?games.map(g=>{const ar=rank(g.awayRank),hr=rank(g.homeRank);const away=`${ar?`<span class="rank">#${ar}</span> `:''}${esc(g.away||'Away')}`;const home=`${hr?`<span class="rank">#${hr}</span> `:''}${esc(g.home||'Home')}`;const div=esc(normalizeDivision(g.division||g.subdivision||g.ncaaDivision));const net=esc(g.network||g.broadcast||'No network');const time=g.startTime?new Date(g.startTime).toLocaleString():'';return `<div class="game"><strong>${away} @ ${home}</strong><div class="meta">${div} • ${esc(time)} • ${net}</div></div>`}).join(''):'<div class="small">Endpoint returned zero games.</div>';
   const sample=games.find(g=>g.rankingPoll||g.rankingHealthy!=null||g.rankingWeek!=null);const topMeta=data?.rankingSource||data?.rankingPoll||sample?.rankingPoll||'not supplied';const healthy=data?.rankingHealthy??sample?.rankingHealthy;const rankedCount=data?.rankedTeamCount??null;
   $('ranking').innerHTML=`Poll/source: <b>${esc(topMeta)}</b><br>Healthy: <b>${esc(healthy==null?'not supplied':healthy)}</b><br>Ranked-team count: <b>${esc(rankedCount==null?'not supplied':rankedCount)}</b><br>Top-25 games detected in returned schedule: <b>${top25}</b>`;
 }catch(err){setStatus(`FAILED • ${err.message}`,'bad');$('raw').textContent=String(err.stack||err);$('games').innerHTML=`<div class="small">${esc(err.message)}</div>`;['total','top25','fbs','fcs','dii','diii'].forEach(id=>$(id).textContent='—')}
}
$('run').addEventListener('click',run);run();
</script>
</body>
</html>
