<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where's the Game?</title>
  <!-- WTG 0.1H8j modular shell: preserves full approved app.html and loads small feature patches safely. -->
  <style>
    html,body{margin:0;min-height:100%;background:#020812;color:#d9f4ff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    .boot strong{display:block;font-size:22px;letter-spacing:.04em}.boot span{display:block;margin-top:9px;color:#8dbbd4;font-size:13px}
  </style>
</head>
<body>
  <div class="boot"><div><strong>WHERE'S THE GAME?</strong><span>Loading live sports…</span></div></div>
  <script>
  (async()=>{
    try{
      const response=await fetch('./app.html?v=0.1H8j',{cache:'no-store'});
      if(!response.ok)throw new Error(`App shell HTTP ${response.status}`);
      let html=await response.text();
      const patch='<script src="./wtg-mlb-streaming-patch.js?v=0.1H8j"><\/script>';
      if(/<\/body>/i.test(html))html=html.replace(/<\/body>/i,patch+'</body>');
      else html+=patch;
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      console.error('WTG shell load failed',error);
      document.body.innerHTML='<div class="boot"><div><strong>WHERE\'S THE GAME?</strong><span>Could not load the app. Refresh to retry.</span></div></div>';
    }
  })();
  </script>
</body>
</html>
