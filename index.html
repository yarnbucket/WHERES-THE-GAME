<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Where's the Game? — Test Build</title>
  <style>
    :root{--bg:#f5f8fc;--card:#fff;--ink:#0b1b3a;--muted:#60708d;--blue:#1769e8;--blue2:#e8f2ff;--line:#dce5f0;--shadow:0 8px 24px rgba(23,55,99,.08)}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
    .app{width:min(100%,760px);margin:0 auto;padding:18px 14px 90px}
    .header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--blue);color:#fff;font-size:28px;box-shadow:var(--shadow)}
    .brand h1{margin:0;font-size:25px;line-height:.9;font-style:italic}.brand p{margin:7px 0 0;color:var(--muted);font-size:14px}
    .gear{border:0;background:transparent;font-size:24px;cursor:pointer}
    .sport-tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:#e9eef6;border-radius:16px;padding:4px;overflow-x:auto}
    .sport-tabs button{border:0;background:transparent;color:#263957;font-weight:800;padding:12px 10px;border-radius:12px;min-width:76px;cursor:pointer}
    .sport-tabs button.active{color:#fff;background:var(--blue);box-shadow:0 5px 12px rgba(23,105,232,.28)}
    .date-row{display:grid;grid-template-columns:48px 1fr 48px 86px;align-items:center;gap:10px;margin:18px 0 12px}
    .navbtn,.todaybtn{border:1px solid var(--line);background:#fff;color:var(--blue);height:46px;border-radius:13px;font-size:20px;font-weight:800;cursor:pointer}
    .todaybtn{font-size:15px;background:#eef5ff}.date-label{text-align:center;font-weight:800;font-size:17px}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 10px}.section-head h2{font-size:20px;margin:0}
    .demo-pill{margin-left:auto;background:#fff3cd;color:#765800;border:1px solid #ffe083;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800;white-space:nowrap}
    .games{display:grid;gap:12px}
    .game-card{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
    .game-sport{color:var(--blue);font-size:12px;font-weight:900;letter-spacing:.05em}.game-title-row{display:flex;align-items:flex-start;gap:8px;margin-top:7px}
    .game-name{font-size:19px;line-height:1.2;margin:0;flex:1}.favorite{border:1px solid #aebbd0;background:#fff;width:32px;height:32px;border-radius:7px;cursor:pointer;font-size:18px}.favorite.active{color:#f3aa00}
    .game-time{margin:10px 0 2px;font-weight:800}.game-network,.game-venue{margin:4px 0;color:var(--muted);font-size:14px}
    .directv-box{background:var(--blue2);border-radius:16px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:130px}
    .directv-label{font-weight:900;font-size:12px;letter-spacing:.06em}.directv-channel{font-size:24px;font-weight:900;margin:16px 0 7px}.directv-note{font-size:12px;color:var(--muted)}
    .status{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--muted);text-align:center}
    .bottom-nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(calc(100% - 24px),700px);display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:0 12px 30px rgba(13,41,76,.18)}
    .bottom-nav button{border:0;background:transparent;border-radius:12px;padding:10px;font-weight:800;color:#5b6b84;cursor:pointer}.bottom-nav button.active{background:#edf4ff;color:var(--blue)}
    @media(max-width:640px){.app{padding:12px 10px 86px}.brand h1{font-size:22px}.sport-tabs{grid-template-columns:repeat(6,minmax(72px,1fr))}.date-row{grid-template-columns:44px 1fr 44px 76px}.game-card{grid-template-columns:minmax(0,1fr) 118px;padding:12px}.directv-channel{font-size:21px}.game-name{font-size:17px}}
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <div class="logo">📺</div>
      <div><h1>WHERE'S<br>THE GAME?</h1><p>Find the game. Watch the game.</p></div>
    </div>
    <button class="gear" title="Settings">⚙️</button>
  </header>

  <div class="sport-tabs" id="sportTabs">
    <button data-sport="nfl">NFL</button>
    <button data-sport="ncaaf">NCAAF</button>
    <button data-sport="mlb" class="active">MLB</button>
    <button data-sport="nhl">NHL</button>
    <button data-sport="nba">NBA</button>
    <button data-sport="ncaab">NCAAB</button>
  </div>

  <div class="date-row">
    <button class="navbtn" id="prevDay">‹</button>
    <div class="date-label" id="dateLabel"></div>
    <button class="navbtn" id="nextDay">›</button>
    <button class="todaybtn" id="todayBtn">Today</button>
  </div>

  <div class="section-head">
    <h2 id="scheduleTitle">MLB Games</h2>
    <div class="demo-pill">TEST BUILD</div>
  </div>

  <div id="status" class="status" style="display:none"></div>
  <main class="games" id="gamesList"></main>
</div>

<nav class="bottom-nav">
  <button id="todayNav" class="active">📅 Today</button>
  <button id="favoritesNav">★ Favorites</button>
</nav>

<script>
const sportLabels={nfl:"NFL",ncaaf:"NCAA Football",mlb:"MLB",nhl:"NHL",nba:"NBA",ncaab:"NCAA Basketball"};
const demoData={
  mlb:[
    {id:"mlb1",sport:"MLB",away:"Atlanta Braves",home:"Philadelphia Phillies",startTime:"2026-09-06T17:05:00Z",network:"MLB.TV, BravesVision, NBC 10",venue:"Citizens Bank Park",directv:{channel:"TBD",note:"Channel lookup pending"}},
    {id:"mlb2",sport:"MLB",away:"New York Mets",home:"Miami Marlins",startTime:"2026-09-06T17:10:00Z",network:"MLB.TV, Marlins.TV, SNY",venue:"loanDepot park",directv:{channel:"TBD",note:"Channel lookup pending"}},
    {id:"mlb3",sport:"MLB",away:"New York Yankees",home:"San Diego Padres",startTime:"2026-09-06T20:10:00Z",network:"MLB.TV, Padres.TV, YES",venue:"Petco Park",directv:{channel:"742 HD",note:"Yankees Feed"}},
    {id:"mlb4",sport:"MLB",away:"Athletics",home:"Seattle Mariners",startTime:"2026-09-06T20:10:00Z",network:"ESPN Unlimited, MLB.TV, Mariners.TV",venue:"T-Mobile Park",directv:{channel:"740 HD",note:"Mariners Feed"}}
  ],
  nfl:[{id:"nfl1",sport:"NFL",away:"New York Giants",home:"Philadelphia Eagles",startTime:"2026-09-13T17:00:00Z",network:"FOX",venue:"Lincoln Financial Field",directv:{channel:"53",note:"WPGH • FOX"}}],
  ncaaf:[{id:"cfb1",sport:"NCAA Football",away:"Penn State",home:"Pittsburgh",startTime:"2026-09-12T23:30:00Z",network:"ABC",venue:"Acrisure Stadium",directv:{channel:"4",note:"WTAE • ABC"}}],
  nhl:[{id:"nhl1",sport:"NHL",away:"New York Rangers",home:"Pittsburgh Penguins",startTime:"2026-10-10T23:00:00Z",network:"SportsNet Pittsburgh",venue:"PPG Paints Arena",directv:{channel:"659",note:"SportsNet Pittsburgh"}}],
  nba:[{id:"nba1",sport:"NBA",away:"Boston Celtics",home:"Cleveland Cavaliers",startTime:"2026-10-22T23:00:00Z",network:"ESPN",venue:"Rocket Arena",directv:{channel:"206",note:"ESPN"}}],
  ncaab:[{id:"cbb1",sport:"NCAA Basketball",away:"Duke",home:"North Carolina",startTime:"2026-12-05T01:00:00Z",network:"ESPN",venue:"Dean Smith Center",directv:{channel:"206",note:"ESPN"}}]
};
let selectedSport="mlb",selectedDate=new Date("2026-09-06T12:00:00"),favoritesOnly=false,currentGames=[];
function fmtDate(d){return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"})}
function fmtTime(s){if(!s)return"TBD";return new Date(s).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:"America/New_York",timeZoneName:"short"})}
function getFavs(){try{return JSON.parse(localStorage.getItem("wtg-test-favs")||"[]")}catch{return[]}}
function setFavs(a){localStorage.setItem("wtg-test-favs",JSON.stringify(a))}
function isFav(id){return getFavs().includes(String(id))}
function toggleFav(id){const arr=getFavs(),key=String(id);setFavs(arr.includes(key)?arr.filter(x=>x!==key):[...arr,key]);render()}
function renderGame(g){const d=g.directv||{channel:"TBD",note:"Channel lookup pending"};return `<article class="game-card"><div><span class="game-sport">${g.sport}</span><div class="game-title-row"><h3 class="game-name">${g.away} @ ${g.home}</h3><button class="favorite ${isFav(g.id)?"active":""}" onclick="toggleFav('${g.id}')">${isFav(g.id)?"★":"☆"}</button></div><p class="game-time">${fmtTime(g.startTime)}</p><p class="game-network">${g.network||"Broadcast information unavailable"}</p><p class="game-venue">${g.venue||""}</p></div><div class="directv-box"><div class="directv-label">DIRECTV</div><div class="directv-channel">${d.channel}</div><div class="directv-note">${d.note}</div></div></article>`}
function render(){document.getElementById("dateLabel").textContent=fmtDate(selectedDate);const base=demoData[selectedSport]||[];currentGames=favoritesOnly?base.filter(g=>isFav(g.id)):base;document.getElementById("scheduleTitle").textContent=favoritesOnly?`Favorite Games (${currentGames.length})`:`${sportLabels[selectedSport]} Games (${currentGames.length})`;document.getElementById("gamesList").innerHTML=currentGames.map(renderGame).join("");const status=document.getElementById("status");if(!currentGames.length){status.style.display="block";status.textContent=favoritesOnly?"No favorites for this sport yet.":"No demo games loaded for this sport."}else status.style.display="none"}
document.querySelectorAll("#sportTabs button").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll("#sportTabs button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");selectedSport=btn.dataset.sport;favoritesOnly=false;document.getElementById("todayNav").classList.add("active");document.getElementById("favoritesNav").classList.remove("active");render()}));
document.getElementById("prevDay").onclick=()=>{selectedDate.setDate(selectedDate.getDate()-1);render()};
document.getElementById("nextDay").onclick=()=>{selectedDate.setDate(selectedDate.getDate()+1);render()};
document.getElementById("todayBtn").onclick=()=>{selectedDate=new Date();favoritesOnly=false;render()};
document.getElementById("todayNav").onclick=()=>{favoritesOnly=false;document.getElementById("todayNav").classList.add("active");document.getElementById("favoritesNav").classList.remove("active");render()};
document.getElementById("favoritesNav").onclick=()=>{favoritesOnly=true;document.getElementById("favoritesNav").classList.add("active");document.getElementById("todayNav").classList.remove("active");render()};
render();
</script>
</body>
</html>
