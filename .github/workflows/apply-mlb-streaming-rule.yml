name: Apply MLB streaming-only rule

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-mlb-streaming-rule.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch MLB package-only behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''  if(national&&["213","213-1"].includes(String(national.directvChannel))){
    const dedicatedFeed=guide.find(x=>x?.channel&&x?.type==="package");
    if(dedicatedFeed){
      return{
        channel:`${dedicatedFeed.channel}${dedicatedFeed.hd?" HD":""}`,
        note:dedicatedFeed.feed||dedicatedFeed.network||"MLB Extra Innings"
      };
    }
  }

  if(national)return{channel:national.directvChannel,note:national.network||"National"};''',
          '''  // A real national MLB channel always outranks an Extra Innings package feed.
  if(national)return{channel:national.directvChannel,note:national.network||"National"};''',
          'MLB Network priority')

          replace_once(
          '''function hasDirectvChannel(game){
  const options=Array.isArray(game?.directv)?game.directv:[];
  const guide=Array.isArray(game?.directvGuide?.channels)?game.directvGuide.channels:[];
  return options.some(x=>x?.directvChannel)||guide.some(x=>x?.channel)||Boolean(getDirectvFallback(game));
}''',
          '''function hasDirectvChannel(game){
  const options=Array.isArray(game?.directv)?game.directv:[];
  const guide=Array.isArray(game?.directvGuide?.channels)?game.directvGuide.channels:[];
  // MLB Extra Innings package feeds are not normal TV channels for WTG priority.
  return options.some(x=>x?.directvChannel)||guide.some(x=>x?.channel&&String(x?.type||"").toLowerCase()!=="package")||Boolean(getDirectvFallback(game));
}

function isMlbPackageOnlyGame(game){
  if((game?._sportKey||selectedSport)!=="mlb")return false;

  const options=Array.isArray(game?.directv)?game.directv:[];
  const guide=Array.isArray(game?.directvGuide?.channels)?game.directvGuide.channels:[];
  const streams=getStreamingServices(game);

  const hasNormalTv=
    options.some(x=>x?.directvChannel&&["national","local","regional"].includes(String(x?.type||"").toLowerCase())) ||
    guide.some(x=>x?.channel&&String(x?.type||"").toLowerCase()!=="package") ||
    Boolean(getDirectvFallback(game));

  // Mainstream streaming services stay in the normal list even if MLB.TV is also named.
  const hasMainstreamStream=streams.some(name=>name!=="MLB.TV");
  if(hasNormalTv||hasMainstreamStream)return false;

  const hasMlbTv=streams.includes("MLB.TV");
  const hasExtraInnings=
    guide.some(x=>x?.channel&&String(x?.type||"").toLowerCase()==="package") ||
    /mlb extra innings/i.test(String(game?.directvGuide?.package||""));

  return hasMlbTv||hasExtraInnings;
}''',
          'DIRECTV package classification')

          replace_once(
          '''function isStreamingOnlyGame(game){
  if(hasDirectvChannel(game))return false;''',
          '''function isStreamingOnlyGame(game){
  if(isMlbPackageOnlyGame(game))return true;
  if(hasDirectvChannel(game))return false;''',
          'streaming-only classifier')

          replace_once(
          '''function getViewingSourceDisplay(game,conflictKeys=new Set()){
  const directv=getDirectvDisplay(game,conflictKeys);
  const streams=getStreamingServices(game);
  const network=(game.broadcast||game.network||"").trim();
  const hasDirectv=hasDirectvChannel(game);

  if(selectedProvider==="directv"){''',
          '''function getViewingSourceDisplay(game,conflictKeys=new Set()){
  const directv=getDirectvDisplay(game,conflictKeys);
  const streams=getStreamingServices(game);
  const network=(game.broadcast||game.network||"").trim();
  const hasDirectv=hasDirectvChannel(game);

  if(isMlbPackageOnlyGame(game)){
    return{
      label:"STREAMING",
      channel:"MLB STREAMING ONLY",
      note:"MLB.TV / MLB Extra Innings package required",
      streams
    };
  }

  if(selectedProvider==="directv"){''',
          'MLB streaming-only display')

          replace_once(
          '''function sortProGames(games){
  return [...games].sort((a,b)=>{
    const fav=isFavorite(b.id)-isFavorite(a.id);
    if(fav)return fav;
    const p=proPriorityScore(b)-proPriorityScore(a);
    if(p)return p;
    const live=isLiveGame(b)-isLiveGame(a);
    if(live)return live;
    return (Date.parse(a?.startTime||"")||0)-(Date.parse(b?.startTime||"")||0);
  });
}''',
          '''function sortProGames(games){
  return [...games].sort((a,b)=>{
    // MLB package-only games are always demoted below normal TV/mainstream streaming.
    const aMlbPackageOnly=isMlbPackageOnlyGame(a);
    const bMlbPackageOnly=isMlbPackageOnlyGame(b);
    if(aMlbPackageOnly!==bMlbPackageOnly)return aMlbPackageOnly?1:-1;

    // Inside the package-only group, make the list easy to scan alphabetically.
    if(aMlbPackageOnly&&bMlbPackageOnly){
      const awayCmp=String(a?.away||a?.name||"").localeCompare(String(b?.away||b?.name||""),undefined,{sensitivity:"base"});
      if(awayCmp)return awayCmp;
      const homeCmp=String(a?.home||"").localeCompare(String(b?.home||""),undefined,{sensitivity:"base"});
      if(homeCmp)return homeCmp;
      return String(a?.id||"").localeCompare(String(b?.id||""));
    }

    const fav=isFavorite(b.id)-isFavorite(a.id);
    if(fav)return fav;
    const p=proPriorityScore(b)-proPriorityScore(a);
    if(p)return p;
    const live=isLiveGame(b)-isLiveGame(a);
    if(live)return live;
    return (Date.parse(a?.startTime||"")||0)-(Date.parse(b?.startTime||"")||0);
  });
}''',
          'MLB package-only sort')

          marker='0.1H8g NCAAF Top 25 direct-rank merge repair -->'
          if marker in text:
              text=text.replace(marker,'0.1H8g NCAAF Top 25 direct-rank merge repair; 0.1H8j MLB package-only streaming demotion -->',1)

          path.write_text(text,encoding='utf-8')
          PY

      - name: Commit patched frontend
        shell: bash
        run: |
          git config user.name "WTG Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Demote MLB package-only games to streaming-only"
          git push origin HEAD:main
