name: WTG Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-regressions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/routes/rugby.js
          node --check src/routes/collegeWrestling.js
          node --check ../wtg-multichannel-patch.js
          node --check ../wtg-gender-tags-patch.js
